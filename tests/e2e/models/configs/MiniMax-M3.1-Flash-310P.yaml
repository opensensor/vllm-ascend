notes: >-
  All cases before int8_v13 are historical FP16 diagnostics, not INT8
  quality qualification. Current INT8, direct gather, scale reuse and fused activation
  plus shared-pool partial graphs, INT32 route counts and native scale-row reuse
  plus compact decode routing and selected dense INT8 reach 3.958 tokens/s
  median short decode. QKV/indexer and routing remain unchanged.
  Real-weight greedy HTTP/SSE diagnostics; the sparse retrieval prompt has
  3443 tokens and exceeds the 16-block attention budget. These small checks
  do not establish broad model accuracy or native-release quantization parity.
  Unformatted raw completion was repetitive and is not qualified. Full-model
  graph mode, sequence-parallel MoE and speculation are rejected by this adapter.
  Decode graphs around eager sparse attention are enabled through resident controls.
