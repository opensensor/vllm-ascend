notes: >-
  All cases before int8_v13 are historical FP16 diagnostics, not INT8
  quality qualification. Current INT8 median short decode is 2.231 tokens/s.
  Real-weight greedy HTTP/SSE diagnostics; the sparse retrieval prompt has
  3443 tokens and exceeds the 16-block attention budget. These small checks
  do not establish broad model accuracy or native-release quantization parity.
  Unformatted raw completion was repetitive and is not qualified. ACLGraph,
  sequence-parallel MoE and speculation are rejected by this eager adapter.
