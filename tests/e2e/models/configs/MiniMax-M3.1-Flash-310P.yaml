# Manual runtime diagnostic, not an lm-eval task configuration.
# Do not pass this file to test_lm_eval_correctness.py.
model_name: /srv/ai/storage/models/MiniMax-M3.1-Flash-W4
model_type: runtime_diagnostic
hardware: Three dual-chip Ascend 310P3 cards, six memory banks
manual_only: true
serve:
  tensor_parallel_size: 2
  pipeline_parallel_size: 3
  pipeline_layers: [21, 20, 19]
  enable_expert_parallel: true
  dtype: float16
  enforce_eager: true
  max_model_len: 163840
  kv_cache_memory_bytes: 4410900480
  additional_config:
    hccl_buffer_size_mb: 32
  max_num_seqs: 1
  max_num_batched_tokens: 512
  served_model_name: minimax-m31-flash
  image_limit: 1
  video_limit: 0
  expert_layout: nz256_int8_repacked
  checkpoint_expert_layout: nz256
  max_grouped_routes: 2048
  enable_auto_tool_choice: true
  tool_call_parser: minimax_m3
  reasoning_parser: minimax_m31
  native_kernel: minimax_w4_int8_v13
  attention_query_tile: 64
